[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-markets-lab"
version = "0.3.0"
description = "Walk-forward momentum and rolling-beta pairs research tools"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Eren Duysak"}]
license = "MIT"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "yfinance>=0.2",
]

[project.optional-dependencies]
app = [
    "matplotlib>=3.8",
    "plotly>=5.24",
    "streamlit>=1.62",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[project.scripts]
aml-research = "adaptive_markets_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
