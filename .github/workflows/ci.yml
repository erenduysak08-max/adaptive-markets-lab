name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[app,dev]"
      - run: ruff check .
      - run: pytest -q
      - run: aml-research --demo --demo-periods 700 --train-periods 252 --output /tmp/aml-smoke
      - run: aml-research --strategy pairs --demo --demo-periods 500 --pair-lookback 40 --output /tmp/aml-pairs-smoke
